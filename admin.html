<title>Ohrca — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ee;--pn:#fff;--ink:#1c2326;--mu:#697378;--ln:#dcd9ce;--ac:#0f5c4d;--ac2:#e2eee9;--wa:#a4570b;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#14181a;--pn:#1c2225;--ink:#e7eae8;--mu:#8d989d;--ln:#2e373b;--ac:#5fc1a8;--ac2:#1d3933;--wa:#e0a35c;--er:#f08a82}
:root{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:root[data-theme="dark"] button.p,:root[data-theme="dark"] .seg button.on{color:#0b1f1a}
#thm{padding:4px 10px;font-size:15px;line-height:1;border-radius:99px}

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 24px;border-bottom:1px solid var(--ln);background:var(--pn);flex-wrap:wrap}header img{height:34px;width:auto}header b{color:var(--ac)}.sp{margin-left:auto}
nav{display:flex;gap:4px;padding:10px 24px 0;flex-wrap:wrap}nav button{border:0;background:none;padding:8px 14px;border-radius:6px 6px 0 0;color:var(--mu);cursor:pointer;font:inherit}nav button.on{background:var(--pn);color:var(--ac);font-weight:500;border:1px solid var(--ln);border-bottom-color:var(--pn)}
main{padding:20px 24px 60px;max-width:1280px}.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:18px;margin-bottom:16px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.st{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px}.st b{display:block;font:500 22px 'IBM Plex Mono',monospace}.st span{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}.n{text-align:right;font-family:'IBM Plex Mono',monospace}
label{display:block;font-size:12px;color:var(--mu);font-weight:500}input,select,textarea{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}td select,td input{margin:0;padding:4px 6px;width:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:6px 12px;border-radius:6px}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:500}button.d{color:var(--er);border-color:var(--er)}button:disabled{opacity:.4}button.s{padding:3px 8px;font-size:12px}
.f2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:14px}.tag{font:11px 'IBM Plex Mono',monospace;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac)}.tag.w{background:transparent;border:1px solid var(--wa);color:var(--wa)}.tag.e{background:transparent;border:1px solid var(--er);color:var(--er)}
.mv{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:50;padding:12px}.mb{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:20px;width:640px;max-width:96vw;max-height:94vh;overflow:auto}.mb img{max-width:100%;border:1px solid var(--ln);border-radius:6px;margin:6px 0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;display:none;z-index:99}.drop{display:block;border:1.5px dashed var(--ln);border-radius:8px;padding:30px;text-align:center;cursor:pointer;color:var(--mu)}.drop:hover{border-color:var(--ac);color:var(--ac)}.mu{color:var(--mu)}.hid{display:none}

<script>
/* ---- leitor da planilha SINAPI (mesmo do app original) ---- */
const UFN={AC:'Acre',AL:'Alagoas',AM:'Amazonas',AP:'Amapá',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MG:'Minas Gerais',MS:'Mato Grosso do Sul',MT:'Mato Grosso',PA:'Pará',PB:'Paraíba',PE:'Pernambuco',PI:'Piauí',PR:'Paraná',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RO:'Rondônia',RR:'Roraima',RS:'Rio Grande do Sul',SC:'Santa Catarina',SE:'Sergipe',SP:'São Paulo',TO:'Tocantins'};
const REG={SD:['Não desonerado','CSD','ISD','Não desonerado: encargos sociais sobre a mão de obra não desonerados, de acordo com as bases.'],CD:['Desonerado','CCD','ICD','Desonerado: embutido nos preços unitário dos insumos de mão de obra, de acordo com as bases.'],SE:['Sem encargos sociais','CSE','ISE','Sem encargos sociais sobre a mão de obra, de acordo com as bases.']};
const fmt=n=>(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),r2=x=>Math.round((x+Number.EPSILON)*100)/100;

function parse(buf){
 const wb=XLSX.read(buf,{type:'array',cellFormula:true,sheets:['ISD','ICD','ISE','CSD','CCD','CSE','Analítico']});
 const items=new Map();let ufs=null,ref='',emi='';
 for(const [rg,a] of Object.entries(REG))for(const [nm,kind] of [[a[1],'C'],[a[2],'I']]){
  const ws=wb.Sheets[nm];if(!ws||!ws['!ref'])continue;
  const R=XLSX.utils.decode_range(ws['!ref']),g=(r,c)=>ws[XLSX.utils.encode_cell({r,c})],v=(r,c)=>g(r,c)?.v;
  let hr=-1;for(let r=0;r<20;r++){if(/^(Grupo|Classifica)/.test(String(v(r,0)??'').trim())){hr=r;break}}
  if(hr<0)continue;
  for(let r=0;r<8;r++){const t=String(v(r,0)??'');if(!ref&&t.startsWith('Mês de Ref'))ref=String(v(r,1));if(!emi&&t.startsWith('Data de em'))emi=String(v(r,1))}
  let best=null;
  for(const r of [hr-1,hr]){const m={};for(let c=0;c<=R.e.c;c++){const t=String(v(r,c)??'').trim();if(UFN[t]&&!(t in m))m[t]=c}if(!best||Object.keys(m).length>Object.keys(best).length)best=m}
  if(!ufs)ufs=Object.keys(best).sort();
  for(let r=hr+1;r<=R.e.r;r++){
   const x=g(r,1);if(!x)continue;
   let code=x.f?(x.f.match(/MATCH\(\s*(\d+)/)||[])[1]:x.v;code=String(code??'').trim();if(!code||code==='0')continue;
   const d=v(r,2);if(!d)continue;
   const key=kind+code;let it=items.get(key);
   if(!it){it={k:kind,c:code,g:v(r,0)||'',d:String(d),u:String(v(r,3)??''),p:{}};items.set(key,it)}
   it.p[rg]=ufs.map(u=>{const n=v(r,best[u]);return typeof n==='number'?n:null});
  }
 }
 let an=null;const wa=wb.Sheets['Analítico'];
 if(wa&&wa['!ref']){an={};const Q=XLSX.utils.decode_range(wa['!ref']);let h=-1;for(let r=0;r<20;r++){if(/^Grupo/.test(String(wa[XLSX.utils.encode_cell({r,c:0})]?.v??'').trim())){h=r;break}}
  for(let r=h+1;h>=0&&r<=Q.e.r;r++){const g=c=>wa[XLSX.utils.encode_cell({r,c})]?.v,t=g(2);if(!t)continue;const k=String(g(1)).trim();(an[k]||(an[k]=[])).push([t==='INSUMO'?'I':'C',String(g(3)).trim(),String(g(4)??''),String(g(5)??''),+g(6)||0])}}
 if(!items.size)throw new Error('Nenhuma composição ou insumo encontrado. Verifique se é a planilha de referência SINAPI.');

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=(p,o)=>OhrcaAuth.api('/admin'+p,o),brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=x=>x?new Date(x).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
const ago=x=>{if(!x)return '—';const m=(Date.now()-Date.parse(x))/6e4;return m<2?'agora':m<60?Math.round(m)+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' d'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)};
const ERR={invalid_package:'Pacote inválido',already_reviewed:'Compra já revisada',cannot_demote_self:'Você não pode remover seu próprio acesso adm',cannot_block_self:'Você não pode bloquear a si mesmo'};
const em=e=>ERR[e.message]||(/^(invalid|too_long|required|duplicate):/.test(e.message)?'Campo inválido: '+e.message.split(':')[1]:e.message);
const TABS=[['dash','Visão geral'],['users','Usuários'],['buys','Compras'],['base','Base SINAPI'],['cfg','Configurações']];let tab='dash',U=[],uq='',bf='pending';
function nav(){$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}
async function go(t){tab=t||tab;nav();$('#main').innerHTML='<p class="mu">Carregando…</p>';try{await({dash,users,buys,base,cfg}[tab])()}catch(e){$('#main').innerHTML=`<p class="mu">Erro: ${esc(em(e))}</p>`}}

async function dash(){const s=await api('/stats'),c=(v,l)=>`<div class="st"><b>${v}</b><span>${l}</span></div>`;
$('#main').innerHTML=`<div class="grid">${c(s.users,'Usuários cadastrados')}${c(s.active24h,'Ativos em 24 h')}${c(s.active7d,'Ativos em 7 dias')}${c(s.active30d,'Ativos em 30 dias')}${c(s.new7d,'Novos em 7 dias')}${c(s.blocked,'Contas bloqueadas')}${c(s.noExport,'Ativas sem exportações (atenção)')}${c(s.refunds,'Reembolsos de moedas')}${c(s.xlsx,'Excel gerados')}${c(s.pdf,'PDF gerados')}${c(s.coinsSpent,'Moedas gastas')}${c(s.pending,'Compras em análise')}${c(brl(s.pendingValue),'Valor em análise')}${c(brl(s.revenue),'Receita aprovada')}</div>`}

async function users(){U=(await api('/users')).items;drawU()}
const noExp=u=>u.role==='user'&&!u.blocked&&((u.loginCount|0)>=10||(u.nProj|0)>=3)&&!(u.nXlsx|0)&&!(u.nPdf|0); // mesma regra do Worker
const SUS='Usa bastante o app (10+ acessos ou 3+ projetos) e nunca gerou arquivo cobrado. Pode ser só uso leve, ou a cobrança sendo burlada: confira o último acesso e a atividade.';let uf='';
function drawU(){const q=uq.toLowerCase(),L=U.filter(u=>(!q||(u.email+' '+(u.name||'')).toLowerCase().includes(q))&&(uf===''||(uf==='sus'&&noExp(u))||(uf==='blk'&&u.blocked)));
$('#main').innerHTML=`<div class="card" style="display:flex;gap:12px;flex-wrap:wrap;align-items:end"><label style="flex:1;min-width:220px">Buscar<input id="uq" value="${esc(uq)}" placeholder="e-mail ou nome" maxlength="80"></label><label>Filtro<select id="uf" style="width:auto">${[['','Todos'],['sus','Sem exportações (atenção)'],['blk','Bloqueados']].map(o=>`<option value="${o[0]}" ${uf===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label></div><div class="card"><table><tr><th>Usuário</th><th>Role</th><th class="n">Moedas</th><th>Último acesso</th><th class="n">Logins</th><th class="n">Proj.</th><th class="n">Excel</th><th class="n">PDF</th><th class="n">Gasto</th><th class="n">Reemb.</th><th>Últ. geração</th><th>Cadastro</th><th>Status</th><th></th></tr>${L.map(u=>`<tr><td>${esc(u.email)}<div class="mu" style="font-size:12px">${esc(u.name||'')}</div></td><td><select data-role="${esc(u.uid)}">${['user','free','adm'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td class="n">${u.coins|0}</td><td title="${esc(dt(u.lastActive))}">${ago(u.lastActive)}</td><td class="n">${u.loginCount|0}</td><td class="n">${u.nProj|0}</td><td class="n">${u.nXlsx|0}</td><td class="n">${u.nPdf|0}</td><td class="n">${u.spent|0}</td><td class="n">${u.refunds|0}</td><td title="${esc(dt(u.lastExport))}">${u.lastExport?ago(u.lastExport):'—'}</td><td>${dt(u.createdAt)}</td><td style="white-space:nowrap">${u.blocked?'<span class="tag e">bloqueado</span>':'<span class="tag">ativo</span>'}${noExp(u)?` <span class="tag w" title="${esc(SUS)}">sem exportações</span>`:''}</td><td style="white-space:nowrap"><button class="s" data-coin="${esc(u.uid)}">± moedas</button> <button class="s ${u.blocked?'':'d'}" data-blk="${esc(u.uid)}">${u.blocked?'Desbloquear':'Bloquear'}</button></td></tr>`).join('')||'<tr><td colspan="14" class="mu">Nenhum usuário.</td></tr>'}</table></div>`;
const i=$('#uq');i.oninput=()=>{uq=i.value;const p=i.selectionStart;drawU();const j=$('#uq');j.focus();j.setSelectionRange(p,p)}}
async function patchU(uid,b){try{await api('/users/'+uid,{method:'PATCH',body:b});toast('Salvo');await users()}catch(e){toast(em(e));await users()}}

async function buys(){const r=(await api('/purchases?status='+bf)).items;
$('#main').innerHTML=`<div class="card" style="display:flex;gap:8px;align-items:center">Filtro: ${['pending','approved','rejected',''].map(s=>`<button class="s ${bf===s?'p':''}" data-bf="${s}">${{pending:'Em análise',approved:'Aprovadas',rejected:'Recusadas','':'Todas'}[s]}</button>`).join('')}</div><div class="card"><table><tr><th>Data</th><th>Usuário</th><th class="n">Moedas</th><th class="n">Valor</th><th>Status</th><th>Revisão</th><th></th></tr>${r.map(p=>`<tr><td>${dt(p.createdAt)}</td><td>${esc(p.email)}</td><td class="n">${p.coins}</td><td class="n">${brl(p.amount)}</td><td><span class="tag ${p.status==='pending'?'w':p.status==='rejected'?'e':''}">${{pending:'em análise',approved:'aprovada',rejected:'recusada'}[p.status]||esc(p.status)}</span></td><td class="mu">${p.reviewedBy?esc(p.reviewedBy)+' · '+dt(p.reviewedAt)+(p.note?'<br>'+esc(p.note):''):'—'}</td><td><button class="s" data-rv="${esc(p.id)}" data-u="${esc(p.email)}" data-v="${p.amount}" data-s="${esc(p.status)}">Ver comprovante</button></td></tr>`).join('')||'<tr><td colspan="7" class="mu">Nada por aqui.</td></tr>'}</table></div>`}
async function review(id,email,val,st){const m=document.createElement('div');m.className='mv';m.innerHTML=`<div class="mb"><h3 style="margin:0">Comprovante — ${esc(email)}</h3><p class="mu">Valor esperado: <b>${brl(val)}</b></p><div id="im" class="mu">Carregando…</div>${st==='pending'?`<label>Observação (opcional)<input id="nt" maxlength="200"></label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="p" data-x="approve">Aprovar</button><button class="d" data-x="reject">Recusar</button><button class="d" data-x="rejectb">Recusar e bloquear conta</button><button data-x="close" class="sp">Fechar</button></div>`:'<button data-x="close" style="margin-top:10px">Fechar</button>'}</div>`;
document.body.appendChild(m);
try{const r=await api('/receipt/'+id);m.querySelector('#im').innerHTML=r.imgs.map(s=>/^data:image\/(webp|jpeg);base64,/.test(s)?`<img src="${s}" alt="comprovante">`:'').join('')}catch(e){m.querySelector('#im').textContent='Erro: '+em(e)}
m.onclick=async e=>{const x=e.target.dataset.x;if(e.target===m||x==='close')return m.remove();if(!x)return;
if(x!=='approve'&&!confirm(x==='rejectb'?'Recusar, retirar as moedas e BLOQUEAR esta conta?':'Recusar e retirar as moedas liberadas?'))return;
try{await api('/purchases/'+id+'/review',{method:'POST',body:{action:x==='approve'?'approve':'reject',blockUser:x==='rejectb',note:m.querySelector('#nt').value}});m.remove();toast('Compra revisada');buys()}catch(er){toast(em(er))}}}

let staged=null;
async function base(){staged=null;const m=await api('/sbase'),ok=!m.none;
$('#main').innerHTML=`<div class="card"><h3 style="margin-top:0">Base SINAPI publicada</h3>${ok?`<div class="grid"><div class="st"><b>${esc(m.ref)}</b><span>mês de referência</span></div><div class="st"><b>${esc(m.emi||'—')}</b><span>emissão</span></div><div class="st"><b>${(m.ufs||[]).length}</b><span>UFs</span></div><div class="st"><b>${(m.bytes/1e6).toFixed(1)} MB</b><span>tamanho na nuvem</span></div></div><p class="mu">Publicada em ${dt(m.updatedAt)} por ${esc(m.updatedBy||'—')}. Os usuários recebem a atualização no próximo acesso.</p><button class="d" data-sbd="1">Remover base publicada</button>`:'<p class="mu" style="margin-bottom:0">Nenhuma base publicada ainda. Os usuários ficam sem base até você publicar uma.</p>'}</div>
<div class="card"><h3 style="margin-top:0">${ok?'Atualizar a base':'Publicar a base'}</h3>
<ol style="margin:0 0 14px 18px;padding:0;line-height:1.75"><li>Baixe o ZIP do mês em <a href="https://www.caixa.gov.br/site/Paginas/downloads.aspx#categoria_888" target="_blank" rel="noopener" style="color:var(--ac)">Download de Arquivos | CAIXA</a> (categoria SINAPI) e extraia.</li><li>Selecione a planilha de referência (ex.: <code>SINAPI_Referência_AAAA_MM.xlsx</code>) abaixo e aguarde a leitura.</li><li>Confira o resumo e clique em <b>Publicar para todos os usuários</b>.</li></ol>
<label class="drop" id="dz"><input type="file" id="bf" accept=".xlsx,.xlsm" class="hid">Selecionar ou arrastar a planilha SINAPI (.xlsx)</label><div id="bs" style="margin-top:14px"></div></div>`;
$('#bf').onchange=e=>stage(e.target.files[0]);const dz=$('#dz');dz.ondragover=e=>e.preventDefault();dz.ondrop=e=>{e.preventDefault();stage(e.dataTransfer.files[0])}}
function stage(f){if(!f)return;const bs=$('#bs');staged=null;bs.innerHTML='<span class="mu">Lendo '+esc(f.name)+'… pode levar alguns segundos.</span>';
setTimeout(async()=>{try{staged=parse(await f.arrayBuffer());const nc=staged.items.filter(i=>i.k==='C').length,c=(v,l)=>`<div class="st"><b>${v}</b><span>${l}</span></div>`;
bs.innerHTML=`<div class="grid">${c(esc(staged.ref),'mês de referência')}${c(esc(staged.emi||'—'),'emissão')}${c(staged.ufs.length,'UFs')}${c(nc.toLocaleString('pt-BR'),'composições')}${c((staged.items.length-nc).toLocaleString('pt-BR'),'insumos')}</div><p class="mu">Ao publicar, esta base substitui a atual para todos os usuários.</p><button class="p" data-pub="1">Publicar para todos os usuários</button>`}catch(er){bs.innerHTML='<span style="color:var(--er)">'+esc(er.message)+'</span>'}},50)}
async function cfg(){const c=await api('/config');
$('#main').innerHTML=`<form id="cf" class="card" autocomplete="off"><h3 style="margin-top:0">Preços e custos</h3><div class="f2">
<label>Valor de cada moeda (R$)<input name="coinPrice" type="number" step="0.01" min="0.01" max="1000" required value="${c.coinPrice}"></label>
<label>Moedas iniciais por usuário<input name="initialCoins" type="number" step="1" min="0" max="100000" required value="${c.initialCoins}"></label>
<label>Custo do Excel (moedas)<input name="costXlsx" type="number" step="1" min="0" max="1000" required value="${c.costXlsx}"></label>
<label>Custo do PDF (moedas)<input name="costPdf" type="number" step="1" min="0" max="1000" required value="${c.costPdf}"></label></div>
<h3>Pacotes de moedas <span class="mu" style="font-weight:400;font-size:12px">(preço em branco = moedas × valor da moeda)</span></h3><div id="pk"></div><button type="button" id="addp">+ Pacote</button>
<h3>Pagamento e suporte</h3><div class="f2">
<label>Contato de suporte (máx. 120)<input name="support" maxlength="120" value="${esc(c.support)}" placeholder="WhatsApp, e-mail…"></label>
<label>Chave PIX (máx. 140)<input name="pixKey" maxlength="140" value="${esc(c.pixKey)}"></label>
<label>Nome do favorecido (máx. 60)<input name="pixName" maxlength="60" value="${esc(c.pixName)}"></label></div>
<label>Informações de pagamento (máx. 400)<textarea name="payInfo" maxlength="400" rows="3">${esc(c.payInfo)}</textarea></label>
<div style="margin-top:14px"><button class="p" type="submit">Salvar configurações</button></div></form>`;
const pk=$('#pk'),row=(p={})=>{const d=document.createElement('div');d.className='f2';d.style.cssText='grid-template-columns:1fr 1fr auto;align-items:end;margin-bottom:8px';d.innerHTML=`<label>Moedas<input data-c type="number" step="1" min="1" max="100000" required value="${p.coins??''}"></label><label>Preço (R$, opcional)<input data-p type="number" step="0.01" min="0.01" max="100000" value="${p.price??''}"></label><button type="button" data-del>Remover</button>`;pk.appendChild(d)};
c.packages.forEach(row);$('#addp').onclick=()=>{if(pk.children.length>=6)return toast('Máximo de 6 pacotes');row()};
pk.onclick=e=>{if(e.target.dataset.del!==undefined){if(pk.children.length<=1)return toast('Mantenha ao menos 1 pacote');e.target.closest('.f2').remove()}};
$('#cf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),b=Object.fromEntries(f);
b.packages=[...pk.children].map(d=>({coins:+d.querySelector('[data-c]').value,price:d.querySelector('[data-p]').value===''?null:+d.querySelector('[data-p]').value}));
try{await api('/config',{method:'PUT',body:b});toast('Configurações salvas')}catch(er){toast(em(er))}}}

document.addEventListener('click',e=>{const t=e.target,d=t.dataset;if(d.t)go(d.t);else if(d.bf!==undefined){bf=d.bf;buys()}
else if(d.pub){if(!staged)return;if(!confirm('Publicar a base '+staged.ref+' para TODOS os usuários? Ela substitui a base atual.'))return;t.disabled=true;t.textContent='Enviando…';Cloud.saveBase(staged,true).then(()=>{toast('Base publicada');base()}).catch(er=>{t.disabled=false;t.textContent='Publicar para todos os usuários';toast('Falha ao publicar: '+em(er))})}
else if(d.sbd){if(confirm('Remover a base compartilhada? Quem usa a base compartilhada mantém a cópia local.'))api('/sbase',{method:'DELETE'}).then(()=>{toast('Base removida');base()}).catch(er=>toast(em(er)))}
else if(d.rv)review(d.rv,d.u,+d.v,d.s);else if(d.blk){const u=U.find(x=>x.uid===d.blk);if(confirm(u.blocked?'Desbloquear esta conta?':'Bloquear o acesso desta conta?'))patchU(d.blk,{blocked:!u.blocked})}
else if(d.coin){const v=prompt('Ajuste de moedas (use negativo para remover). Ex.: 10 ou -5');if(v===null)return;patchU(d.coin,{coinsDelta:v})}});
document.addEventListener('change',e=>{if(e.target.id==='uf'){uf=e.target.value;return drawU()}const u=e.target.dataset.role;if(u&&confirm('Alterar a role deste usuário para "'+e.target.value+'"?'))patchU(u,{role:e.target.value});else if(u)users()});
$('#out').onclick=()=>{OhrcaAuth.signOut();$('#app').classList.add('hid')};
OhrcaAuth.start({admin:true,title:'Administração',subtitle:'Acesso restrito. Entre com a conta de administrador.',logo:LOGO,onReady:s=>{Cloud.setToast(toast);$('#app').classList.remove('hid');$('#who').textContent=s.email;go('dash')}});
</script></body></html>
