<style>
:root{--bg:#f4f3ee;--pn:#fff;--ink:#1c2326;--mu:#697378;--ln:#dcd9ce;--ac:#0f5c4d;--ac2:#e2eee9;--wa:#a4570b;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181a;--pn:#1c2225;--ink:#e7eae8;--mu:#8d989d;--ln:#2e373b;--ac:#5fc1a8;--ac2:#1d3933;--wa:#e0a35c;--er:#f08a82}}
:root[data-theme="dark"]{--bg:#14181a;--pn:#1c2225;--ink:#e7eae8;--mu:#8d989d;--ln:#2e373b;--ac:#5fc1a8;--ac2:#1d3933;--wa:#e0a35c;--er:#f08a82}
:root{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:root[data-theme="dark"] button.p,:root[data-theme="dark"] .seg button.on{color:#0b1f1a}
#thm{padding:4px 10px;font-size:15px;line-height:1;border-radius:99px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif;min-width:1180px}
#app{display:grid;grid-template-columns:230px 1fr;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--ln);background:var(--pn)}
.logo{font-weight:600;font-size:16px;letter-spacing:.2px}.logo b{color:var(--ac)}
.chip{font:12px 'IBM Plex Mono',monospace;background:var(--ac2);color:var(--ac);padding:3px 9px;border-radius:99px;margin-left:auto}.chip.off{background:transparent;border:1px dashed var(--er);color:var(--er)}
nav{padding:18px 12px;border-right:1px solid var(--ln);overflow:auto}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:6px;cursor:pointer;color:var(--mu);margin-bottom:2px}
nav a i{font:500 12px 'IBM Plex Mono',monospace;width:22px;height:22px;border:1px solid var(--ln);border-radius:50%;display:grid;place-items:center;font-style:normal}
nav a.on{background:var(--ac2);color:var(--ac);font-weight:500}nav a.on i{border-color:var(--ac)}
main{overflow:auto;padding:28px 36px 60px}
h1{font-size:20px;margin:0 0 4px;font-weight:600}.sub{color:var(--mu);margin:0 0 22px;max-width:760px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:20px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.s2{grid-column:span 2}.s4{grid-column:span 4}
label{display:block;font-size:12px;color:var(--mu);font-weight:500}
input,select,textarea{width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:64px}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:7px 14px;border-radius:6px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:500}button.p:disabled{opacity:.4;cursor:not-allowed}
button.g{border:0;background:none;color:var(--ac);padding:4px 6px}button.x{border:0;background:none;color:var(--mu);padding:2px 6px}
.drop{display:block;border:1.5px dashed var(--ln);border-radius:8px;padding:38px;text-align:center;cursor:pointer;color:var(--mu)}.drop:hover{border-color:var(--ac);color:var(--ac)}
.drop input{display:none}.kv{display:flex;gap:36px;flex-wrap:wrap}.kv b{display:block;font:500 20px 'IBM Plex Mono',monospace}.kv span{font-size:12px;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);text-align:left;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:6px 8px;border-bottom:1px solid var(--ln);vertical-align:middle}td input{margin:0;padding:4px 6px}.n{text-align:right;font-family:'IBM Plex Mono',monospace}.cd{font-family:'IBM Plex Mono',monospace;color:var(--mu)}
.orc{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}.orc>div:first-child{position:sticky;top:0}
.res{max-height:520px;overflow:auto;margin-top:10px}.res div{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 4px;border-bottom:1px solid var(--ln);font-size:12.5px}.res small{color:var(--mu);font-family:'IBM Plex Mono',monospace}
.eh{display:flex;gap:10px;align-items:center;margin-bottom:8px}.eh input{font-weight:600}.eh .tt{white-space:nowrap}.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.hl td,.card.hl{background:var(--ac2)}.hd{cursor:grab;color:var(--mu);user-select:none;width:18px}.ok{color:var(--ac)}.wr{color:var(--wa)}.er{color:var(--er)}.empty{color:var(--mu);text-align:center;padding:30px}
.ck{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;display:none}

.dc{cursor:pointer;text-align:right;min-width:104px;border:1px solid var(--ln);border-radius:6px;padding:4px 8px;background:var(--bg);font-family:'IBM Plex Mono',monospace;line-height:1.3}.dc:hover{border-color:var(--ac)}.dc small{display:block;color:var(--mu)}.dc .mu{color:var(--mu);font-size:12px}.dc.blk{opacity:.45;cursor:not-allowed;background:transparent;border-style:dashed}.dc.blk:hover{border-color:var(--ln)}
#mdov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50}.mdl{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:22px;width:430px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.3)}.mdl h2{font-size:16px;margin:0 0 2px}
.seg{display:flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden}.seg button{flex:1;border:0;border-radius:0;background:var(--bg);color:var(--mu)}.seg button.on{background:var(--ac);color:#fff;font-weight:500}.seg button:disabled{opacity:.4;cursor:not-allowed}

window.startApp=async function(SESSION){
const UID=SESSION.uid,LK='orcasinapi_p_'+UID;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UFN={AC:'Acre',AL:'Alagoas',AM:'Amazonas',AP:'Amapá',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MG:'Minas Gerais',MS:'Mato Grosso do Sul',MT:'Mato Grosso',PA:'Pará',PB:'Paraíba',PE:'Pernambuco',PI:'Piauí',PR:'Paraná',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RO:'Rondônia',RR:'Roraima',RS:'Rio Grande do Sul',SC:'Santa Catarina',SE:'Sergipe',SP:'São Paulo',TO:'Tocantins'};
const REG={SD:['Não desonerado','CSD','ISD','Não desonerado: encargos sociais sobre a mão de obra não desonerados, de acordo com as bases.'],CD:['Desonerado','CCD','ICD','Desonerado: embutido nos preços unitário dos insumos de mão de obra, de acordo com as bases.'],SE:['Sem encargos sociais','CSE','ISE','Sem encargos sociais sobre a mão de obra, de acordo com as bases.']};
const fmt=n=>(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),r2=x=>Math.round((x+Number.EPSILON)*100)/100;
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let db=null,view='base',logo=null,lastRes=[],dbReady=false;
/* ---------- Logos: tamanho real da imagem e posicionamento ---------- */
function imgSz(src){try{const b=Uint8Array.from(atob(src.split(',')[1]),c=>c.charCodeAt(0));
 if(b[0]===0x89)return{w:((b[16]<<24)|(b[17]<<16)|(b[18]<<8)|b[19])>>>0,h:((b[20]<<24)|(b[21]<<16)|(b[22]<<8)|b[23])>>>0};
 let i=2;while(i<b.length-8){if(b[i]!==0xFF){i++;continue}const m=b[i+1];if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return{h:(b[i+5]<<8)|b[i+6],w:(b[i+7]<<8)|b[i+8]};i+=2+((b[i+2]<<8)|b[i+3])}}catch(e){}return{w:1,h:1}}
function fitImg(src,mw,mh){const d=imgSz(src),k=Math.min(mw/d.w,mh/d.h)||1;return{w:d.w*k,h:d.h*k}}

const NEW=()=>({obra:{regime:'SD',uf:'AM',cargo:'Responsável Técnico'},etapas:[],meses:3,dist:{},sel:0,inicio:'',prazo:0,dur:30,bdiD:{},enc:[],inc:{bdi:false,enc:false},med:[],msel:0,dia:[]}),pid=()=>'p'+Date.now()+Math.floor(Math.random()*999);
let S=NEW(),P={cur:null,items:{}},warned=false;
try{let t=localStorage.getItem(LK);if(!t&&!localStorage.getItem('orcasinapi_claimed')){t=localStorage.getItem('orcasinapi_p');if(t)localStorage.setItem('orcasinapi_claimed',UID)}if(t)P=JSON.parse(t);else{const o=localStorage.getItem('orcasinapi');if(o){const id=pid();P={cur:id,items:{[id]:{id,arq:false,upd:Date.now(),data:JSON.parse(o)}}}}}}catch(e){}
if(!P.items||!P.cur||!P.items[P.cur]){const id=pid();P={cur:id,items:{[id]:{id,arq:false,upd:Date.now(),data:NEW()}}}}
S=Object.assign(NEW(),P.items[P.cur].data);
let _syT=null;const qSync=()=>{clearTimeout(_syT);_syT=setTimeout(()=>Cloud.push(()=>P),2500)};
const store=()=>{qSync();try{localStorage.setItem(LK,JSON.stringify(P))}catch(e){if(!warned){warned=true;toast('Armazenamento do navegador cheio: exporte o projeto para não perder dados.')}}};
const save=()=>{const p=P.items[P.cur];p.data=S;p.upd=Date.now();store()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)};
const idb=(m,v)=>new Promise(ok=>{try{const q=indexedDB.open('orcasinapi_'+UID,1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>{const o=q.result.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k'),r=m==='get'?o.get('db'):m==='del'?o.delete('db'):o.put(v,'db');r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)};q.onerror=()=>ok(null)}catch(e){ok(null)}});

/* ---------- Base SINAPI ---------- */
function setDb(d){d.items.forEach(i=>i.s=norm(i.d+' '+i.c));d.map=new Map(d.items.map(i=>[i.k+i.c,i]));d.nc=d.items.filter(i=>i.k==='C').length;d.ni=d.items.length-d.nc;db=d;
 if(!d.ufs.includes(S.obra.uf))S.obra.uf=d.ufs[0];
 $('#chip').className='chip';$('#chip').textContent='SINAPI '+d.ref}
/* ---------- Base na nuvem: publicada pelo administrador (admin.html) ---------- */
async function syncBase(){const sm=await Cloud.baseMeta(true);
 if(sm&&!sm.none&&(!db||db.sh!==sm.updatedAt)){const b=await Cloud.loadBase(true);if(b){b.sh=sm.updatedAt;await idb('put',{ref:b.ref,emi:b.emi,ufs:b.ufs,items:b.items,an:b.an,sh:b.sh});setDb(b);toast('Base SINAPI '+b.ref+' carregada')}}}
/* ---------- Cálculo ---------- */
const bdiF=()=>1+(+S.obra.bdi||0)/100;

<div class="orc"><div class="card"><div style="display:flex;gap:8px"><select id="qt" style="width:130px;margin:0"><option value="C">Composições</option><option value="I">Insumos</option></select><input id="q" placeholder="Código ou termos da descrição" style="margin:0" data-f="q"></div><div class="res" id="res"><div class="empty" style="display:block">${db?'Digite para pesquisar.':'Carregue a base SINAPI primeiro.'}</div></div></div><div id="bud"></div></div>`},
crono(){const n=S.meses,c=calc(),sc=sched();return `<h1>Cronograma físico-financeiro</h1><p class="sub">Clique em um período para informar o avanço da etapa em porcentagem ou em valor (R$). Cada linha deve somar 100%; ao atingir 100%, os demais períodos da etapa são bloqueados.</p>

<div class="card"><table><tr><th>Etapa</th><th class="n">Valor</th>${Array.from({length:n},(_,p)=>`<th class="n">${pd(p)} dias${S.inicio?'<br><small>até '+pdate(p)+'</small>':''}</th>`).join('')}<th class="n">Soma</th></tr>
${S.etapas.map((e,a)=>{const d=S.dist[e.id]||[],s=d.slice(0,n).reduce((x,y)=>x+(+y||0),0),full=Math.abs(s-100)<.005;return `<tr><td>${a+1}. ${esc(e.nome||'(sem nome)')}</td><td class="n">${fmt(c.E[a].t)}</td>${Array.from({length:n},(_,p)=>`<td><div class="dc ${full&&!(+d[p]>0)?'blk':''}" data-a="dcell" data-e="${a}" data-p="${p}" title="${full&&!(+d[p]>0)?'Etapa já atingiu 100%':'Clique para editar'}">${+d[p]>0?`<b>R$ ${fmt(sc.E[a].v[p])}</b><small>${fmt(+d[p])}%</small>`:`<span class="mu">${full?'bloqueado':'definir'}</span>`}</div></td>`).join('')}<td class="n ${Math.abs(s-100)<.005?'ok':'wr'}" id="ds${a}">${fmt(s)}</td></tr>`}).join('')||`<tr><td class="empty" colspan="9">Crie as etapas do orçamento primeiro.</td></tr>`}</table></div><div class="card"><canvas id="cs" style="width:100%;max-width:900px"></canvas></div>`},
gerar(){const c=calc(),n=S.etapas.length,ni=S.etapas.reduce((s,e)=>s+e.itens.length,0),np=S.etapas.reduce((s,e,a)=>s+c.E[a].it.filter(x=>x.u==null).length,0),bad=S.etapas.filter(e=>Math.abs((S.dist[e.id]||[]).slice(0,S.meses).reduce((x,y)=>x+(+y||0),0)-100)>.005).length,O=S.obra;
 const ck=(ok,t,bad='wr')=>`<div class="ck"><span class="${ok?'ok':bad}">${ok?'●':'○'}</span>${!ok&&bad==='er'?`<b class="er">${t}</b>`:t}</div>`;
 return `<h1>Gerar Excel</h1><p class="sub">Arquivo com as abas Resumo do Orçamento, Orçamento Sintético e CRONOGRAMA, com fórmulas ativas.</p><div class="card">

<div style="margin:16px 0"><b>Conferência do orçamento</b>${(()=>{const is=issues();return is.length?is.slice(0,40).map(x=>`<div class="ck"><span class="wr">⚠</span><span style="flex:1"><b>${x.t}</b> — ${esc(x.d)}</span><button class="g" data-a="goi" data-e="${x.a}" data-i="${x.b}">ir ao item</button></div>`).join('')+(is.length>40?`<div class="ck">e mais ${is.length-40} pendências…</div>`:''):'<div class="ck"><span class="ok">●</span>Nenhuma pendência encontrada.</div>'})()}</div>
<p><b class="n" id="tt">R$ ${fmt(c.tot)}</b> total geral com B.D.I.</p><div style="margin:12px 0"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto;margin:0" data-f="inc" data-k="bdi" ${S.inc?.bdi?'checked':''}>Incluir aba B.D.I. detalhado</label><label style="display:flex;gap:8px;align-items:center;color:var(--ink);margin-top:6px"><input type="checkbox" style="width:auto;margin:0" data-f="inc" data-k="enc" ${S.inc?.enc?'checked':''}>Incluir aba Encargos Sociais ${S.inc?.enc&&!(S.enc||[]).length?'<span class="wr">(nenhuma linha cadastrada)</span>':''}</label></div><button class="p" data-a="gen" ${ni?'':'disabled'}>Gerar arquivo Excel</button> <button class="p" data-a="pdf" ${ni?'':'disabled'}>Gerar PDF (mesmas abas do Excel)</button></div>`}};
const NAV=[['base','Base SINAPI'],['proj','Projetos'],['obra','Dados da obra'],['bdi','B.D.I. e Encargos'],['orc','Orçamento'],['crono','Cronograma'],['med','Medição'],['dia','Diário de obras'],['gerar','Gerar Excel']];
function render(){$('#nav').innerHTML=NAV.map((n,i)=>`<a data-a="go" data-v="${n[0]}" class="${n[0]===view?'on':''}"><i>${i+1}</i>${n[1]}${n[0]==='base'&&(()=>{const e=emiDays();return e&&e.n>30})()?' <span class="wr" title="Base com mais de 30 dias">⚠</span>':''}</a>`).join('');const noDb=dbReady&&!db&&view!=='base'&&view!=='proj'?`<div class="card" style="border-color:var(--er);background:color-mix(in srgb,var(--er) 8%,var(--pn));display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><b class="er">⚠ Base SINAPI não carregada</b><br><small class="cd">Sem a base não é possível pesquisar composições e insumos nem obter preços. A base é publicada pelo administrador: tente novamente mais tarde ou fale com o suporte.</small></span></div>`:'';$('#main').innerHTML=noDb+`<div style="float:right"><button data-a="reset" ${view==='proj'||view==='base'?'hidden':''}>↺ ${view==='base'?'Remover base':view==='gerar'?'Resetar tudo':'Resetar esta aba'}</button></div>`+V[view]();if(view==='orc')renderBud();if(view==='crono'){const cv=$('#cs');if(cv)drawS(cv,isDark())}}
function renderBud(){const c=calc(),pn=issues().reduce((m,x)=>(m[x.a]=(m[x.a]||0)+1,m),{});$('#bud').innerHTML=`<div style="display:flex;gap:8px;margin-bottom:10px"><button data-a="cola">Recolher todas</button><button data-a="expa">Expandir todas</button></div>`+S.etapas.map((e,a)=>`<div class="card ${a===S.sel?'sel':''}" id="c${a}" data-dz="e" data-e="${a}"><div class="eh" style="margin-bottom:${e.cl?0:8}px"><button class="x" data-a="tg" data-e="${a}" title="Recolher/expandir">${e.cl?'▸':'▾'}</button><span class="hd" draggable="true" data-dg="e" data-e="${a}" title="Arraste para reordenar">⠿</span><b class="cd">${a+1}</b><input data-f="en" data-e="${a}" placeholder="Nome da etapa" value="${esc(e.nome)}"><span class="wr" id="pn${a}" title="Pendências" ${pn[a]?'':'hidden'}>⚠ ${pn[a]||0}</span><small class="cd">${e.itens.length} itens</small><span class="tt n" id="te${a}">R$ ${fmt(c.E[a].t)}</span><button class="g" data-a="pick" data-e="${a}">${a===S.sel?'selecionada':'selecionar'}</button><button class="g" data-a="dupe" data-e="${a}">duplicar</button><button class="x" data-a="rme" data-e="${a}">✕</button></div>
${e.cl?'':e.itens.length?`<table><tr><th></th><th>Item</th><th>Código</th><th>Descrição</th><th>Und</th><th>Memória de cálculo</th><th>Quant.</th><th class="n">Unit c/ BDI</th><th class="n">Total</th><th></th></tr>${e.itens.map((i,b)=>{const p=i.banco!=='SINAPI',d=(f,w,t)=>`<input data-f="pi" data-k="${f}" data-e="${a}" data-i="${b}" ${t?'type="number" step="0.01"':''} style="width:${w}" value="${esc(i[f])}">`;
return `<tr id="r${a}_${b}" data-dz="i" data-e="${a}" data-i="${b}"><td class="hd" draggable="true" data-dg="i" data-e="${a}" data-i="${b}">⠿</td><td class="cd">${a+1}.${b+1}</td><td class="cd">${p?d('c','70px'):esc(i.c)}</td><td>${p?d('d','100%'):esc(i.d)}${p?'<br>'+d('unit','90px',1)+' <small>valor unitário sem BDI</small>':''}</td><td>${p?d('u','48px'):esc(i.u)}</td><td><input style="width:150px" placeholder="ex.: 12 x 3 x 2" data-f="mem" data-e="${a}" data-i="${b}" value="${esc(i.mem||'')}"></td><td><input id="qq${a}_${b}" class="n" type="number" min="0" step="0.01" style="width:84px;${i.qtd>0?'':'border-color:var(--er)'}" data-f="q" data-e="${a}" data-i="${b}" value="${i.qtd||''}"></td><td class="n ${c.E[a].it[b].u==null?'er':''}" id="u${a}_${b}">${c.E[a].it[b].u==null?'sem preço':fmt(c.E[a].it[b].ub)}</td><td class="n" id="t${a}_${b}">${fmt(c.E[a].it[b].T)}</td><td style="white-space:nowrap"><button class="x" data-a="dupi" data-e="${a}" data-i="${b}" title="Duplicar item">⧉</button><button class="x" data-a="rmi" data-e="${a}" data-i="${b}">✕</button></td></tr>`}).join('')}</table>`:'<div class="empty">Nenhum item. Pesquise ao lado e adicione.</div>'}
${e.cl?'':`<button class="g" data-a="own" data-e="${a}">+ item próprio</button>`}</div>`).join('')+`<div style="display:flex;justify-content:space-between;align-items:center"><button data-a="adde">+ Nova etapa</button><b>Total geral <span class="n" id="tt">R$ ${fmt(c.tot)}</span></b></div>`}
function search(){const q=norm($('#q').value).trim().split(/\s+/).filter(Boolean),k=$('#qt').value;if(!db||!q.length){$('#res').innerHTML='';return}
 lastRes=[];for(const i of db.items){if(i.k===k&&q.every(t=>i.s.includes(t))){lastRes.push(i);if(lastRes.length>=60)break}}
 $('#res').innerHTML=lastRes.map((i,x)=>{const p=i.p[S.obra.regime]?.[db.ufs.indexOf(S.obra.uf)];return `<div><span>${esc(i.d)}<br><small>${i.c} · ${esc(i.u)} · ${p==null?'sem preço':'R$ '+fmt(p)}</small></span><button class="g" data-a="add" data-x="${x}">Adicionar</button></div>`}).join('')||'<div class="empty" style="display:block">Nenhum resultado.</div>'}

/* ---------- Modal do cronograma ---------- */
let MD=null;
const mdTrim=x=>String(+(+x).toFixed(4));
function mdCtx(){const E=S.etapas[MD.a],T=calc().E[MD.a].t,oth=(S.dist[E.id]||[]).slice(0,S.meses).reduce((x,y,i)=>i===MD.p?x:x+(+y||0),0);return{E,T,oth,rem:Math.max(0,100-oth)}}
function mdClose(){MD=null;const o=$('#mdov');if(o)o.remove()}
function mdRead(){const{T,rem}=mdCtx(),v=Math.max(0,+($('#mdv')?.value)||0);let p=MD.mode==='v'?(T>0?v/T*100:0):v;if(MD.mode==='v'&&T>0&&r2(v)===r2(T*rem/100))p=rem;return{p:Math.min(+p.toFixed(10),rem),cut:p>rem+1e-9}}
function mdUpd(){const{T,oth}=mdCtx(),r=mdRead(),vm=MD.mode==='v';if(r.cut)$('#mdv').value=vm?String(r2(T*r.p/100)):mdTrim(r.p);
 $('#mdeq').textContent=vm?'= '+fmt(r.p)+'% da etapa':'= R$ '+fmt(r2(T*r.p/100));
 $('#mdnote').textContent=(r.cut?'Valor limitado ao disponível da etapa. ':'')+(r.p>0&&oth+r.p>=100-.005?'Com este valor a etapa atinge 100%: os demais períodos serão bloqueados.':'')}
function mdRender(pct){const{E,T,oth,rem}=mdCtx(),vm=MD.mode==='v',val=pct>0?(vm?String(r2(T*pct/100)):mdTrim(pct)):'';const old=$('#mdov');if(old)old.remove();
 document.body.insertAdjacentHTML('beforeend',`<div id="mdov" data-a="dbg"><div class="mdl" role="dialog" aria-modal="true"><h2>Etapa ${MD.a+1} — ${esc(E.nome||'(sem nome)')}</h2><p class="sub" style="margin:0 0 14px">Período: ${pd(MD.p)} dias${S.inicio?' (até '+pdate(MD.p)+')':''}</p>
<div class="seg"><button data-a="dmode" data-m="p" class="${vm?'':'on'}">Porcentagem (%)</button><button data-a="dmode" data-m="v" class="${vm?'on':''}" ${T>0?'':'disabled title="Etapa sem valor: adicione itens com preço"'}>Valor (R$)</button></div>
<label style="margin-top:14px">${vm?'Valor neste período (R$)':'Porcentagem neste período (%)'}<input id="mdv" type="number" min="0" max="${vm?r2(T*rem/100):rem}" step="0.01" value="${val}"></label><div class="cd" id="mdeq" style="margin-top:4px;font-size:12.5px"></div>
<div class="mdin"><span>Valor da etapa</span><b>R$ ${fmt(T)}</b><span>Nos outros períodos</span><b>${fmt(oth)}% · R$ ${fmt(r2(T*oth/100))}</b><span>Disponível neste período</span><b>${fmt(rem)}% · R$ ${fmt(r2(T*rem/100))}</b></div><div id="mdnote" class="wr"></div>
<div class="mdb"><button class="g" data-a="dclear">Limpar</button><span style="flex:1"></span><button data-a="dclose">Cancelar</button><button class="p" data-a="dsave">Salvar</button></div></div></div>`);
 mdUpd();const i=$('#mdv');i.focus();i.select()}
function openD(a,p){const E=S.etapas[a];if(!E)return;const T=calc().E[a].t,d=S.dist[E.id]||[],cur=+d[p]||0,oth=d.slice(0,S.meses).reduce((x,y,i)=>i===p?x:x+(+y||0),0);
 if(oth>=100-.005&&!(cur>0)){toast('Esta etapa já atingiu 100%. Reduza outro período para liberar este.');return}
 MD={a,p,mode:S.dmode==='v'&&T>0?'v':'p'};mdRender(cur)}
function mdSave(clear){if(!MD)return;const{E}=mdCtx(),p=clear?0:mdRead().p,d=S.dist[E.id]||(S.dist[E.id]=[]);for(let i=0;i<S.meses;i++)d[i]=+d[i]||0;d[MD.p]=p;save();mdClose();render()}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,ei=+t.dataset.e,ii=+t.dataset.i;
 if(a==='go'){view=t.dataset.v;render()}
 else if(a==='dcell')openD(ei,+t.dataset.p)
 else if(a==='dmode'){const m=t.dataset.m;if(!MD||m===MD.mode)return;const{p}=mdRead();MD.mode=m;S.dmode=m;save();mdRender(p)}
 else if(a==='dsave')mdSave()
 else if(a==='dclear')mdSave(true)
 else if(a==='dclose')mdClose()
 else if(a==='dbg'){if(e.target===t)mdClose()}
 else if(a==='adde'){S.etapas.push({id:'e'+Date.now(),nome:'',itens:[]});S.sel=S.etapas.length-1;save();renderBud()}
 else if(a==='rme'){if(confirm('Remover esta etapa e seus itens?')){S.etapas.splice(ei,1);S.sel=0;save();renderBud()}}
 else if(a==='rmi'){S.etapas[ei].itens.splice(ii,1);save();renderBud()}
 else if(a==='pick'){S.sel=ei;renderBud()}
 else if(a==='own'){S.etapas[ei].itens.push({banco:'Próprio',c:'',d:'',u:'',qtd:0,unit:0});save();renderBud()}
 else if(a==='add'){const E=S.etapas[S.sel];if(!E)return toast('Crie uma etapa antes de adicionar itens.');const i=lastRes[+t.dataset.x];E.itens.push({banco:'SINAPI',k:i.k,c:i.c,d:i.d,u:i.u,qtd:0});save();renderBud();toast('Adicionado à etapa '+(S.sel+1))}
 else if(a==='auto'){const O=S.obra;O.bancos=(db?`SINAPI - ${db.ref} - ${UFN[O.uf]}`:'');O.encargos=REG[O.regime][3];save();render()}
 else if(a==='eq'){const n=S.meses;S.etapas.forEach(x=>S.dist[x.id]=Array.from({length:n},()=>r2(100/n)).map((v,i,a)=>i===n-1?r2(100-v*(n-1)):v));save();render()}
 else if(a==='reset'){const M={obra:'Limpar todos os dados da obra e os logos?',orc:'Apagar todas as etapas e itens do orçamento? O cronograma também será limpo.',crono:'Limpar todo o cronograma?',med:'Apagar todas as medições deste projeto?',dia:'Apagar todos os registros do diário de obras?',bdi:'Limpar a composição do B.D.I. e os encargos cadastrados?',gerar:'Resetar TUDO (obra, logos, orçamento e cronograma)? A base SINAPI é mantida.'};
  if(!confirm(M[view]))return;const dflt={regime:'SD',uf:db?(db.ufs.includes('AM')?'AM':db.ufs[0]):'AM',cargo:'Responsável Técnico'};
  if(view==='obra'||view==='gerar'){S.obra=dflt;S.logoE=S.logoD=null}
  if(view==='orc'||view==='gerar'){S.etapas=[];S.dist={};S.sel=0}
  if(view==='crono'||view==='gerar'){S.dist={};S.meses=3;S.inicio='';S.prazo=0;S.dur=30}
  if(view==='med'||view==='gerar'){S.med=[];S.msel=0}
  if(view==='dia'||view==='gerar'){S.dia=[]}
  if(view==='bdi'||view==='gerar'){S.bdiD={};S.enc=[];S.inc={bdi:false,enc:false}}
  save();render();toast('Campos resetados')}
 else if(a==='dupe'){const E=S.etapas[ei],N=JSON.parse(JSON.stringify(E));N.id='e'+Date.now();N.itens.forEach(x=>delete x.id);N.nome=(E.nome||'')+' (cópia)';S.dist[N.id]=(S.dist[E.id]||[]).slice();S.etapas.splice(ei+1,0,N);S.sel=ei+1;save();renderBud()}
 else if(a==='dupi'){const L=S.etapas[ei].itens;const cl=JSON.parse(JSON.stringify(L[ii]));delete cl.id;L.splice(ii+1,0,cl);save();renderBud()}
 else if(a==='rlogo'){S[t.dataset.k]=null;save();render()}
 else if(a==='rst'){if(confirm('Limpar todos os percentuais do cronograma?')){S.dist={};save();render()}}

 else if(a==='tg'){S.etapas[ei].cl=!S.etapas[ei].cl;save();renderBud()}
 else if(a==='cola'||a==='expa'){S.etapas.forEach(x=>x.cl=a==='cola');save();renderBud()}
 else if(a==='goi'){S.etapas[ei].cl=false;S.sel=ei;view='orc';save();render();setTimeout(()=>{const el=document.getElementById(ii>=0?`r${ei}_${ii}`:`c${ei}`);if(el){el.scrollIntoView({block:'center'});el.classList.add('hl')}},30)}
